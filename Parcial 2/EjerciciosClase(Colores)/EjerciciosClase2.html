<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos JS</title>

    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .item {
            width: 100px;
            height: 100px;
            background-color: aquamarine;
            text-align: center;
            font-weight: bold;

        }
    </Style>
</head>

<body >

    <button onclick="createElemento()">Agregar Elemento </button>
    <input type="color" value="#7fffd4">
    <br>
    <br>

    <div class="container">

        

    </div>


    <script>
        const container = document.querySelector(".container");
        const input = document.querySelector("input");


        let counter =0;


        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${r}, ${g}, ${b})`;
        }


        function createElemento() {  
            counter++;  
            const item = document.createElement("div");
            const rgbColor = hexToRgb(input.value);
            //item.textContent = counter;
            item.textContent = rgbColor;
            item.style.backgroundColor = rgbColor;
            item.classList.add("item");
            container.appendChild(item);

            
                
        }

    </script>

</body>

</html>
